name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Windows AMD64 Binary
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o verthash-miner-windows-amd64.exe ./cmd/verthash-miner

      - name: Build Linux AMD64 Binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o verthash-miner-linux-amd64 ./cmd/verthash-miner

      - name: Generate SHA256 Checksums
        run: |
          sha256sum verthash-miner-windows-amd64.exe verthash-miner-linux-amd64 > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            verthash-miner-windows-amd64.exe
            verthash-miner-linux-amd64
            SHA256SUMS.txt
